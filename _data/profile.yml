short_bio_text_justify: false
short_bio: >-
  <p>
    I am Changqing Li, a Ph. D. student at the <a href="https://opera-photonics.polytech.ulb.be/" target="_blank">OPERA Photonics</a>,
    <a href="https://www.ulb.be/" target="_blank">Université libre de Bruxelles (ULB)</a>, specializing in Applied Physics
    /Photonics/Optical Engineering. My research primarily focuses on Advanced lasers, like at Mid-infrared and Nonlinear dynamics in ultrafast lasers
    , like solitons and chaos.
  </p>
   <p>
    Prior to joining ULB, I obtained my Master's and Bachleor's degree from 
    <a href="https://oei.hust.edu.cn/" target="_blank">School of Optical and Electronic Information (SOEI)</a>, 
    <a href="https://www.hust.edu.cn/" target="_blank">Huazhong University of Science and Technology (HUST)</a>. 
    I am passionate about explaining the complex nonlinear dynamics not only in lasers but also in other phyicscal scenarios 
    and have been involved in several projects related to ultrafast lasers.
  </p>


